[platformio]
default_envs = linkra-s3-breadboard

[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions/partitions_16mb.csv

lib_deps =
    bblanchon/ArduinoJson @ ^7.4.2
    ESP32Async/ESPAsyncWebServer @ ^3.9.6
    ESP32Async/AsyncTCP @ ^3.4.10
    ; Sqlite3Esp32 liegt gepatcht unter lib/Sqlite3Esp32 (siehe LINKRA_PATCHES.md)

lib_ignore =
    WebServer

build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=3
    -DLOG_LEVEL=LOG_LEVEL_TRACE
    -D CONFIG_ESP_TASK_WDT_TIMEOUT_S=60
    -D CONFIG_ESP_INT_WDT_TIMEOUT_MS=1000
    -D CONFIG_LWIP_MAX_SOCKETS=16
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CONFIG_ESP_COREDUMP_ENABLE_TO_FLASH=1
    -D CONFIG_ESP_COREDUMP_DATA_FORMAT_ELF=1

monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0

[env:linkra-s3-breadboard]
extends = common
board = esp32-s3-devkitc-1
; USB flash-id verified 2026-11-21: 16MB flash, 8MB PSRAM
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_flags =
    ${common.build_flags}
    -DBOARD_HAS_PSRAM
    -D BOARD_BREADBOARD=1
    -include config/hardware_breadboard.h
    ; --- CC1101 #1 (433 MHz OOK) ---
    -DRF_CC1101="CC1101"
    -DRF_MODULE_CS=4
    -DRF_MODULE_GDO0=3
    -DRF_MODULE_GDO2=3
    -DRF_MODULE_SCK=12
    -DRF_MODULE_MISO=13
    -DRF_MODULE_MOSI=11
    -DRF_MODULE_FREQUENCY=433.67
    -DOOK_MODULATION=true
    ; --- CC1101 #2 (868 MHz FSK) ---
    -DRF2_CC1101="CC1101"
    -DRF2_MODULE_CS=10
    -DRF2_MODULE_GDO0=6
    -DRF2_MODULE_GDO2=6
    -DRF2_MODULE_SCK=18
    -DRF2_MODULE_MISO=7
    -DRF2_MODULE_MOSI=17
    -DRF2_MODULE_FREQUENCY=868.35
    -DRF2_OOK_MODULATION=false
    ; --- rtl_433_ESP Configuration ---
    -DRF_MODULE_INIT_STATUS=true
    -DPUBLISH_UNPARSED=true
    ; MINRSSI: Absolute minimum RSSI floor for initial signal consideration
    ; -105 dBm = very low boot floor, gives auto-threshold max headroom (library default: -82)
    -DMINRSSI=-105
    ; RSSI_THRESHOLD: Delta above averageRssi for auto-threshold
    ; Must be high enough to distinguish signals from noise floor
    ; Too low (1-2) = signals fragment into ignored pulses, 100% drop
    ; Too high (15+) = weak signals are never detected
    ; 9 = library default → threshold=-62 → only peak signals pass
    ; 3 = too sensitive → threshold=-71 → 90% noise triggers, 0 pulse captures
    ; 6 = compromise: threshold ~-65 → allows -60 to -65 dBm signals through
    -DRSSI_THRESHOLD=6
    ; DEMOD_DEBUG: Library-level signal debug (disabled — FSK pulse trains are huge and fill serial buffer)
    ; -DDEMOD_DEBUG
    ; RSSI_SAMPLES: Samples between auto-threshold recalculations
    ; 1000 ≈ 1s — fastest recalibration per frequency step during sweep
    -DRSSI_SAMPLES=1000
    ; RECEIVER_BUFFER_SIZE: Pulse train ring buffer depth (reduced from 3 to 2 for heap savings with 275 decoders)
    -DRECEIVER_BUFFER_SIZE=2
    ; --- ReceiverTask stack: only does RSSI polling + receiveMode control ---
    ; 4KB is plenty — no complex processing, just SPI read + arithmetic
    ; (was 32KB from FSK debugging era — that caused 83KB total RF stacks!)
    -Drtl_433_ReceiverTask_Stack=4096
    ; --- DecoderTask stack: 20KB for dual modules (170 OOK + 105 FSK decoders) ---
    ; 30KB was overkill — 20KB gives safe headroom above OOK default (11.5KB)
    -Drtl_433_Decoder_Stack=20000

[env:linkra-s3-pcb]
extends = common
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
build_flags =
    ${common.build_flags}
    -DBOARD_HAS_PSRAM
    -D BOARD_PCB=1
    -include config/hardware_pcb.h
