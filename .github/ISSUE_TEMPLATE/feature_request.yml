name: Funktionswunsch / Feature request
description: Idee für eine neue Funktion oder einen neuen Decoder. / Idea for a new feature or decoder.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Bei Wünschen nach neuen Geräten/Decodern bitte prüfen, ob das Gerät von
        [rtl_433](https://github.com/merbanan/rtl_433) unterstützt wird. Rohdaten nur von **eigenen** Geräten
        anhängen und Funk-IDs unkenntlich machen.

        For new devices/decoders, please check whether [rtl_433](https://github.com/merbanan/rtl_433) supports
        the device. Only attach raw data from **your own** devices and mask radio IDs.
  - type: textarea
    id: problem
    attributes:
      label: Welches Problem soll gelöst werden? / What problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Vorschlag / Proposal
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativen / Alternatives considered
  - type: input
    id: device
    attributes:
      label: Gerät (Hersteller, Modell, Frequenz) / Device (vendor, model, frequency)
      placeholder: z. B. / e.g. TFA 30.3208, 433.92 MHz
